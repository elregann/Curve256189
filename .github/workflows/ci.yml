name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - name: Run examples
        run: |
          for file in example/*.dart; do
            echo "::group::$file"
            dart run "$file"
            echo "::endgroup::"
          done
      - run: dart pub publish --dry-run
